name: CI

# F-08: 门禁与"实际发出去的镜像"对齐。
#
#   backend        dev 锁装齐 → pip check → import 冒烟 → 锁/依赖一致性契约 → pip-audit → ruff → pytest
#   runtime-lock   只用**运行期** requirements.lock 建干净环境 → pip check → import 冒烟
#                  （dev 锁装得上不代表镜像里的运行期锁装得上；G0 门禁要的是后者）
#   docker-build   真正 `docker build` 并验证镜像内 `import rag.api`；runner 无 Docker daemon
#                  时跳过并告警（本地/托管环境可用 vars.RUN_DOCKER_BUILD=false 关掉整个 job）
#   frontend       npm ci → 测试 → build → npm audit
#
# 所有 action 用 commit SHA 固定（`uses: owner/name@<40 hex>  # vX.Y.Z`），tag 可被移动。
# 升级时改 SHA 与注释里的版本，不要改回浮动 tag。
#
# 注意：本仓库 origin 在 Gitee（`git@gitee.com:li-yonghong111/ragv3.git`），GitHub Actions
# **默认不会**因 Gitee 推送而运行。事实与本地等价命令见 docs/deployment.md
# 「CI 与代码托管事实」一节；这些 workflow 只在 GitHub 镜像/迁移后才会生效。

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install development lock
        run: pip install -r requirements-dev.lock
      - name: Check dependency consistency
        run: pip check
      - name: Import smoke (application entrypoint)
        run: python -c "import rag.api"
      - name: Lockfile covers pyproject
        run: pytest tests/test_dependency_lock.py -q -p no:cacheprovider
      - name: Audit runtime dependencies
        run: |
          pip install "pip-audit>=2.9,<3"
          pip-audit -r requirements.lock
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest tests/ -q

  # 干净环境只装运行期锁：镜像就是这么构建的（Dockerfile: COPY requirements.lock）。
  runtime-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install runtime lock only
        run: pip install -r requirements.lock
      - name: Check dependency consistency
        run: pip check
      - name: Import smoke (no dev extras)
        run: python -c "import rag.api"

  docker-build:
    # 本机/托管环境没有 Docker daemon 时可把仓库变量 RUN_DOCKER_BUILD 设为 false 关掉。
    if: ${{ vars.RUN_DOCKER_BUILD != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Build image and smoke the import
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::warning::Docker daemon is unavailable on this runner; skipped the docker build smoke. Run it locally with: docker build -t ragv3:ci . && docker run --rm ragv3:ci python -c 'import rag.api'"
            exit 0
          fi
          docker build --tag ragv3:ci .
          docker run --rm ragv3:ci python -c "import rag.api"
      - name: Assert the build context carries no company data
        run: |
          if ! docker info >/dev/null 2>&1; then
            exit 0
          fi
          docker run --rm ragv3:ci sh -c '! test -e /app/real-case-handoff && ! test -e /app/artifacts'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
